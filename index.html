<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<script>if(location.protocol==="http:"&&location.hostname==="feibitur.janrickmer.de")location.replace("https://"+location.host+location.pathname+location.search+location.hash);</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feibitur</title>
<meta name="description" content="Feibitur – Lernplattform zur Vorbereitung auf das Landesabitur in Hessen.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/archivo-latin-wdth-normal.woff2" as="font" type="font/woff2" crossorigin>

<body>
<noscript><p class="noscript">Feibitur benötigt JavaScript. Bitte aktiviere JavaScript in deinem Browser.</p></noscript>

<!-- Passwortabfrage -->
<section id="gate" class="gate" hidden>
  <form id="gate-form" class="gate-card" autocomplete="off">
    <h1 class="gate-word">Feibitur</h1>
    <p class="gate-lead">Deine Vorbereitung auf das Landesabitur. Bitte gib das Passwort ein, um fortzufahren.</p>
    <label for="gate-pw" class="visually-hidden">Passwort</label>
    <input id="gate-pw" type="password" placeholder="Passwort" autocomplete="current-password" required>
    <button type="submit" class="btn btn-primary">Weiter</button>
    <p id="gate-error" class="gate-error" role="alert" hidden>Das Passwort ist leider falsch.</p>
    <div class="gate-stripes" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
  </form>
  <footer class="legal-links"><a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a></footer>
</section>

<div id="app" hidden></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/app.js"></script>
<script src="assets/js/tools.js"></script>
</body>
</html>
